server:
  host: ${TAILSCAL_HOST_IP:-localhost}
  port: 8083
  api_key: ${SIMPLE_LOCAL_API_KEY}

logging:
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ${MYSQL_PASSWORD}
    database: simple_local
