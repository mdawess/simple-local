[project]
name = "simple-local"
version = "0.1.0"
description = "Bare-bones local inference: one YAML config, one endpoint, CPU only"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pyyaml",
    "huggingface-hub",
    "joblib",
    "scikit-learn",
    "numpy",
]

[project.scripts]
simple-local = "simple_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_local"]
